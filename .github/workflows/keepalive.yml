# GitHubは60日間まったく活動が無いリポジトリのスケジュール実行を自動停止する。
# ワークフローだけのリポジトリはコミットが発生しないため、月1回空コミットを打って止まらないようにする。
name: keepalive

on:
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 空コミットを打つ
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .keepalive
          git add .keepalive
          git commit -m "keepalive" || exit 0
          git push
